<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Every page needs the Latin subset, so it is fetched alongside the stylesheet rather
             than after it. `crossorigin` is required for fonts even on the same origin. -->
        <link
            rel="preload"
            href="/fonts/roboto-mono-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <!-- Generated by favicon-generator; see web-ui/README.md to remake them. -->
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#ffffff" />

        <title>M Prober</title>
      <script type="module" crossorigin src="/js/bundle.js"></script>
      <link rel="stylesheet" crossorigin href="/css/bundle.css">
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
